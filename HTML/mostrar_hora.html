<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fecha y Hora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .encabezado1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      height: 68px;
      padding: 8px 24px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .logos-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
    }
    #izquierda2 {
      max-height: 52px;
      height: auto;
      width: auto;
      max-width: 70%;
      object-fit: contain;
      display: block;
    }
    #derecha2 {
      max-height: 52px;
      height: auto;
      width: auto;
      max-width: 25%;
      object-fit: contain;
      display: block;
    }
    .encabezado2 {
      background: linear-gradient(90deg, #2A3F54 0%, #1e2c3a 100%) !important;
      color: #ffffff !important;
      height: 28px;
      padding: 0 18px !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
    }
    .fecha-texto {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff !important;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      font-size: 13px;
    }
    #reloj {
      font-family: "Courier New", Courier, monospace, Arial;
      font-size: 13.5px;
      font-weight: bold;
      color: #1abb9c;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <section class="encabezado1">
    <div class="logos-wrapper">
       <img id="izquierda2"
           src="../images/cintillo_MPPRIJP_2.jpg"
           alt="Ministerio del Poder Popular para las Relaciones Interiores, Justicia y Paz"
           title="Ministerio del Poder Popular para las Relaciones Interiores, Justicia y Paz"> 
       <img id="derecha2"
           src="../images/mark_cuadrantes.png"
           alt="Emergencias 9-1-1 Mérida"
           title="Emergencias 9-1-1 Mérida"> 
    </div>
  </section>
  <section class="encabezado2">
    <div class="fecha-texto">
      <span id="fecha-actual"></span>
    </div>
    <div id="reloj">--:--:--</div>
  </section>

  <script type="text/javascript">
    function actualizarFecha() {
      var dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
      var meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      var ahora = new Date();
      var diaSemana = dias[ahora.getDay()];
      var diaMes = ahora.getDate();
      var mesNombre = meses[ahora.getMonth()];
      var anio = ahora.getFullYear();
      var texto = diaSemana + ", " + diaMes + " de " + mesNombre + " del " + anio;
      var elem = document.getElementById('fecha-actual');
      if (elem) {
        elem.textContent = texto;
      }
    }

    function checkTime(i) {
      return (i < 10) ? "0" + i : i;
    }

    function startTime() {
      var today = new Date();
      var H = checkTime(today.getHours());
      var m = checkTime(today.getMinutes());
      var s = checkTime(today.getSeconds());
      var elem = document.getElementById('reloj');
      if (elem) {
        elem.textContent = H + ":" + m + ":" + s;
      }
      setTimeout(startTime, 1000);
    }

    window.onload = function() {
      actualizarFecha();
      startTime();
    };
  </script>
</body>
</html>
